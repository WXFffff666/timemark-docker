# TimeMark NAS 一键部署（群晖/威联通/铁威马）
# 首次启动前请在 .env 中设置唯一强密码 DEFAULT_ADMIN_PASSWORD。
# 明文 HTTP 默认禁用；仅可信局域网可显式设置 ALLOW_INSECURE_HTTP=true。
# ⬇️ 只需修改 volumes 路径为你的NAS实际文件夹
#   群晖: /volume1/docker/timemark/data
#   威联通: /share/Container/timemark/data
#   铁威马: /mnt/user/docker/timemark/data

services:
  timemark-app:
    image: xfffff666/timemark:latest
    container_name: timemark-app
    restart: unless-stopped
    # FNOS 1.1.3107+ 权限不足（/app/data 无法写入）时，取消下一行注释以 root 运行：
    # user: "0:0"
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?Set a unique DEFAULT_ADMIN_PASSWORD in your .env file}"
      ALLOW_INSECURE_HTTP: "${ALLOW_INSECURE_HTTP:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # LAN IP 登录 403 时（旧版镜像），可临时加： CORS_ORIGIN=http://192.168.x.x:3808
      # 新版已支持 Origin 与请求 scheme/host/port 完全一致时自动放行，无需手动设置 CORS_ORIGIN
    dns:
      - 223.5.5.5
      - 8.8.8.8
    volumes:
      - /volume1/docker/timemark/data:/app/data